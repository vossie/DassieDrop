<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DassieDrop Login</title>
  <link rel="icon" type="image/png" href="/assets/DassieDrop-dassie-icon.png">
  <link rel="stylesheet" href="/assets/login.css">
</head>
<body>
<main class="card">
  <img class="login-brand" src="/assets/dassiedrop_horizontal_tight.png" alt="DassieDrop">
  <h1>Sign In</h1>
  <p>Enter your DassieDrop username and password.</p>
  <input id="loginUsername" type="text" placeholder="Username" autocomplete="username" autofocus>
  <div class="password-field-wrap">
    <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
    <button class="password-toggle-btn" type="button" data-password-toggle="loginPassword">
      <span class="password-eye-icon" aria-hidden="true"></span>
    </button>
  </div>
  <button id="loginBtn" type="button">Sign In</button>
  <div class="error" id="loginStatus"></div>
</main>
<script src="/assets/password-toggle.js"></script>
<script src="/assets/login.js"></script>
</body>
</html>
